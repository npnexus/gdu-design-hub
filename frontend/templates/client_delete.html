{% extends 'base.html' %}

{% block title %}Delete Order{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto py-20 px-4">

    <div class="bg-white shadow-lg rounded-xl p-8 text-center">

        <div class="text-red-500 text-6xl mb-4">
            ⚠️
        </div>

        <h1 class="text-2xl font-bold mb-4">
            Delete Order
        </h1>

        <p class="text-gray-600 mb-6">
            Are you sure you want to delete
            <strong>Order</strong>?
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="flex justify-center gap-4">
                <button type="submit"
                        class="bg-red-600 text-white px-6 py-3 rounded-lg hover:bg-red-700">
                    Confirm Cancel Your Order
                </button>

                <a href="{% url 'client_order_list' %}"
                class="bg-gray-300 px-6 py-3 rounded-lg hover:bg-gray-400">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>
{% endblock %}
