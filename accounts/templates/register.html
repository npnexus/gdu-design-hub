<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body
    class="min-h-screen bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center p-4">

    <div class="w-full max-w-md">

        <!-- Registration Card -->
        <div class="bg-white/90 backdrop-blur-lg shadow-2xl rounded-3xl p-8">

            <!-- Logo / Title -->
            <div class="text-center mb-8">
                <div class="p-2 rounded-2xl bg-indigo-600 mb-2">
                    <span class="text-white text-2xl font-bold">GDU Design Hub</span>
                </div>

                <h1 class="text-3xl font-bold text-gray-800">
                    Create Account
                </h1>

                <p class="text-gray-500 mt-2">
                    Join us and start your journey today
                </p>
            </div>

            <!-- Form -->
            <form method="POST" class="space-y-5">
                {% csrf_token %}
                {{form.as_p}}
                <!-- Submit Button -->
                <button type="submit"
                    class="w-full bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 hover:cursor-pointer text-white py-3 rounded-xl font-semibold transition duration-300 shadow-lg hover:shadow-xl">
                    Create Account
                </button>
            </form>

            <!-- Login Link -->
            <div class="text-center mt-6">
                <p class="text-gray-600">
                    Already have an account?
                    <a href="{% url 'login' %}" class="text-indigo-600 font-semibold hover:text-indigo-800">
                        Sign In
                    </a>
                </p>
            </div>

        </div>
    </div>

</body>

</html>
