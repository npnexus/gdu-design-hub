<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500 p-4">

    <div class="w-full max-w-md">

        <!-- Login Card -->
        <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl p-8">

            <!-- Header -->
            <div class="text-center mb-8">
                <div class="p-2 rounded-2xl bg-indigo-600 mb-2">
                    <span class="text-white text-2xl font-bold">GDU Design Hub</span>
                </div>

                <h1 class="mt-4 text-3xl font-bold text-gray-800">
                    Welcome Back
                </h1>

                <p class="text-gray-500 mt-2">
                    Sign in to your account
                </p>
            </div>

            <!-- Messages -->
            {% if messages %}
            {% for message in messages %}
            <div class="mb-4 p-3 rounded-lg bg-red-100 border border-red-200 text-red-700">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}

            <!-- Form -->
            <form method="POST" class="space-y-5">
                {% csrf_token %}

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Username
                    </label>
                    <input type="text" name="username" placeholder="Enter your username" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input type="password" name="password" placeholder="Enter your password" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold transition duration-300 shadow-lg">
                    Login
                </button>
            </form>

            <!-- Register Link -->
            <div class="text-center mt-6">
                <p class="text-gray-600">
                    Don't have an account?
                    <a href="{% url 'register' %}" class="text-indigo-600 font-semibold hover:text-indigo-800">
                        Create Account
                    </a>
                </p>
            </div>

        </div>

        <!-- Footer -->
        <p class="text-center text-white mt-6 text-sm">
            © 2026 All Rights Reserved
        </p>

    </div>

</body>

</html>
